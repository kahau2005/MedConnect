{% extends 'admin/base_site.html' %}

{% block content %}
    <h1>BÁO CÁO THỐNG KÊ</h1>

    <form method="GET">
        <label>Từ ngày:
            <input type="date" name="from_date" value="{{ from_date }}">
        </label>
        <label>Đến ngày:
            <input type="date" name="to_date" value="{{ to_date }}">
        </label>
        <button type="submit">
            Lọc Dữ Liệu
        </button>
    </form>


    <div style="display: flex; flex-wrap: wrap; gap: 20px;">
        <div style="width: 70%;">
            <canvas id="ageChart"></canvas>
        </div>
        <div style="width: 70%;">
            <canvas id="specialtyChart"></canvas>
        </div>
        <div style="width: 70%;">
            <canvas id="serviceChart"></canvas>
        </div>
        <div style="width: 70%;">
            <canvas id="diseaseChart"></canvas>
        </div>
        <div style="width: 70%;">
            <canvas id="revenueChart"></canvas>
        </div>
    </div>
    <h1>Tổng doanh thu: {{ total_revenue }} VNĐ</h1>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        window.onload = function () {
            let ageLabels = [];
            let ageData = [];
            {% for a in age_groups %}
                ageLabels.push('{{ a.age_group }}');
                ageData.push({{ a.total }});
            {% endfor %}

            new Chart(document.getElementById('ageChart'), {
                type: 'pie',
                data: {
                    labels: ageLabels,
                    datasets: [{
                        label: 'Số lượng',
                        data: ageData,
                    }]
                },
                options: {plugins: {title: {display: true, text: 'Phân bố độ tuổi'}}}
            });

            let specLabels = [];
            let specData = [];
            {% for s in specialties %}
                specLabels.push('{{ s.doctor__specialty__name }}');
                specData.push({{ s.total }});
            {% endfor %}

            new Chart(document.getElementById('specialtyChart'), {
                type: 'bar',
                data: {
                    labels: specLabels,
                    datasets: [{
                        label: 'Số lượng bệnh nhân',
                        data: specData,
                    }]
                },
                options: {plugins: {title: {display: true, text: 'Bệnh nhân theo Chuyên khoa'}}}
            });

            let servLabels = [];
            let servData = [];
            {% for s in services %}
                servLabels.push('{{ s.service__name }}');
                servData.push({{ s.total_quantity }});
            {% endfor %}

            new Chart(document.getElementById('serviceChart'), {
                type: 'bar',
                data: {
                    labels: servLabels,
                    datasets: [{
                        label: 'Lượt sử dụng',
                        data: servData,
                        backgroundColor: '#ff9020'
                    }]
                },
                options: {
                    indexAxis: 'x',
                    plugins: {title: {display: true, text: 'Dịch vụ'}}
                }
            });

            let diseaseLabels = [];
            let diseaseData = [];
            {% for d in diseases %}
                diseaseLabels.push('{{ d.diagnosis__name }}');
                diseaseData.push({{ d.total_appointments }});
            {% endfor %}

            new Chart(document.getElementById('diseaseChart'), {
                type: 'bar',
                data: {
                    labels: diseaseLabels,
                    datasets: [{
                        label: 'Số ca',
                        data: diseaseData,
                        backgroundColor: '#ff6384'
                    }]
                },
                options: {plugins: {title: {display: true, text: 'Thống kê bệnh'}}}
            });

            let revenueLabels = [];
            let revenueData = [];
            {% for r in revenue_by_date %}
                revenueLabels.push('{{ r.date|date:"d/m/Y" }}');
                revenueData.push({{ r.daily_total }});
            {% endfor %}

            new Chart(document.getElementById('revenueChart'), {
                type: 'line',
                data: {
                    labels: revenueLabels,
                    datasets: [{
                        label: 'Doanh thu',
                        data: revenueData,
                    }]
                },
                options: {plugins: {title: {display: true, text: 'Thống kê doanh thu'}}}
            });
        };
    </script>
{% endblock %}
